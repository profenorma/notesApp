<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profenorma - Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Profenorma Classroom Notes</h1>
        <p>Select your section below:</p>
        <nav id="section-nav">
            <button onclick="selectSection('4A')">4A</button>
            <button onclick="selectSection('4B')">4B</button>
            <button onclick="selectSection('4C')">4C</button>
            <button onclick="selectSection('4D')">4D</button>
            <button onclick="selectSection('4E')">4E</button>
            <button onclick="selectSection('5B')">5B</button>
        </nav>
    </header>

    <main>
        <section id="content-card">
            <h2 id="section-title">Welcome</h2>
            <p id="section-desc">Choose a section above to view and add classroom notes.</p>
            
            <div class="note-input-area" style="margin-top: 20px;">
                <textarea id="quickNote" placeholder="Type a quick note for this section..." rows="3" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;"></textarea>
                <button onclick="saveNote()" style="margin-top: 8px; background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Save Note</button>
            </div>

            <div id="notes-list" style="margin-top: 20px; text-align: left;"></div>
        </section>
    </main>

    <script>
        let currentSec = '';
        function selectSection(sec) {
            currentSec = sec;
            document.getElementById('section-title').innerText = 'Section ' + sec;
            document.getElementById('section-desc').innerText = 'Managing notes and materials for Section ' + sec;
            loadNotes();
        }
        function saveNote() {
            if (!currentSec) { alert('Please select a section first!'); return; }
            const text = document.getElementById('quickNote').value;
            if (!text.trim()) return;
            let notes = JSON.parse(localStorage.getItem('notes_' + currentSec) || '[]');
            notes.push({ text, date: new Date().toLocaleDateString() });
            localStorage.setItem('notes_' + currentSec, JSON.stringify(notes));
            document.getElementById('quickNote').value = '';
            loadNotes();
        }
        function loadNotes() {
            if (!currentSec) return;
            let notes = JSON.parse(localStorage.getItem('notes_' + currentSec) || '[]');
            let listDiv = document.getElementById('notes-list');
            listDiv.innerHTML = '<h3>Saved Notes:</h3>';
            if (notes.length === 0) {
                listDiv.innerHTML += '<p style="color: #666;">No notes saved for this section yet.</p>';
                return;
            }
            notes.forEach((note) => {
                listDiv.innerHTML += <div style="background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #0066cc;"><small style="color: #886;"></small><p style="margin: 4px 0 0 0;"></p></div>;
            });
        }
    </script>
</body>
</html>

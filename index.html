<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profenorma Vector Digital Reader</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body onload="initApp()">
    <header>
        <h1>Profenorma Interactive Digital Book</h1>
        <p>Resolution-independent vector text rendering (Susaeta-style zoomable layout)</p>
        <nav id="section-nav"></nav>
    </header>

    <div class="controls">
        <h2 id="currentSectionTitle" style="margin: 0; font-size: 1.2rem;">Section 4A</h2>
        <button onclick="adjustZoom(0.25)">?? Zoom In (+)</button>
        <button onclick="adjustZoom(-0.25)">?? Zoom Out (-)</button>
        <button onclick="addNote()" style="background:#28a745; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">+ Add Note</button>
    </div>

    <div class="vector-viewport">
        <svg id="readerSvg" viewBox="0 0 700 900">
            <g id="svgContent" transform="scale(1)"></g>
        </svg>
    </div>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
